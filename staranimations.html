<style>

      linear-gradient(var(--grid-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px);

  .titleblock-top .spec { text-align: right; color: var(--ink-dim); }

  .strip { display: flex; flex-direction: column; gap: 16px; counter-reset: tile; }
  .tile {
    counter-increment: tile; position: relative; width: 100%; height: var(--h); overflow: hidden;
    display: flex; flex-direction: column; padding: 40px 56px; background: #050506; color: #eceef1;
  }
  .tile > .stars { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .8s ease; }
  .tile.stars-in > .stars { opacity: 1; }
  .tile > :not(.stars) { position: relative; z-index: 1; }
  .tag { font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
  .tag::before { content: counter(tile, decimal-leading-zero) " — "; opacity: .6; }
  .body { margin: auto 0; max-width: 430px; }
  .title { font: 400 clamp(26px, 3.334vw, 40px)/1 var(--pixel); letter-spacing: 0; position: relative; left: -.12em; }
  .desc { margin-top: 18px; font-size: 14px; line-height: 1.65; color: #a3a8b0; max-width: 40ch; text-wrap: pretty; }
  .foot { display: flex; flex-wrap: wrap; gap: 6px 24px; font: 11px/1.4 var(--mono); letter-spacing: .08em; color: var(--ink-dim); }
  .foot b { font-weight: 400; color: var(--ink); }
  /* static stand-in when WebGL is missing or keeps getting lost */
  .ph { display: none; position: absolute !important; right: 64px; top: 40px; bottom: 40px; width: min(46%, 560px);
    border: 1px dashed rgba(255,255,255,.12); background: radial-gradient(circle, rgba(255,255,255,.16) 1px, transparent 1.5px) 0 0 / 14px 14px;
    place-items: center; font: 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); text-align: center; padding: 20px; }

  .note { margin-top: 16px; padding: 18px 56px; background: #000; font: 11px/1.7 var(--mono); letter-spacing: .06em; color: var(--ink-dim); }
  .note b { color: var(--ink); font-weight: 400; }

  @media (max-width: 900px) {
    .sheet { width: calc(100% - 32px); padding-top: 20px; }
    .titleblock-top { height: auto; min-height: 52px; padding: 12px 26px; flex-wrap: wrap; gap: 4px 16px; }
    .titleblock-top .spec { text-align: left; }
    .tile { height: auto; min-height: 560px; padding: 30px 26px 310px; }
    .body { margin: 26px 0 0; }
    .foot { margin-top: 18px; }
    .ph { left: 26px; right: 26px; top: auto; bottom: 24px; height: 270px; width: auto; }
    .note { padding: 16px 26px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .tile { animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; }

  }

<script type="module">
import * as THREE from 'three';
import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

/* LIFTING A PIECE INTO claude83.html
   1. Engine: in claude83's module script, replace everything from "const RM" down to the end of mountStars() with this file's
      STAR ENGINE block (const RM ... end of mountStars), but keep claude83's own shape functions (mountainShape, vinylShape, chipShape)
      by pasting them back after it. The engine is a drop-in superset, so claude83's existing mounts keep working unchanged.
   2. Copy the SHAPE HELPERS block, then the piece's shape function and any constant it uses (HDD, CAS, SPEC, DISH, NET, LAND/CITIES/ROUTES,
      ATOM, UMA, PLANET, GEARS, LH, PATH, GLYPH ...). They sit right above each function.
   3. Mount it with the piece's SCENES entry plus a place() for that panel, e.g.
        const s = SCENES.hdd;
        mountStars(document.querySelector('.p-xyz'), { ...s, uniforms: s.uniforms && s.uniforms(), size: SMALL ? 128 : 176, dust: .07, accent: '#4a63ff',
          place: (W, H, mob, sh) => { const ppu = Math.min(560 / sh.w, (H - 64) / sh.h); return { ppu, cx: W - 70 - sh.w * ppu / 2, cy: H / 2 }; } });
      (fit is only used by this gallery's place(); the shape's w/h come back as sh.w / sh.h.)
*/
/* =====================================================================================================
   STAR ENGINE — claude83's mountStars(), generalised. Everything claude83 does still works the same
   (code 0 static, code 1 spun + tilted via opts.spin / opts.tilt, code 5 dust). New, all optional:
     opts.view     [['x', a], ['y', b], ['z', c], ...]  rotations applied in order to the whole shape (radians)
     opts.groups   [{ c: [x,y,z], a: [x,y,z], s: rad/s }, ...]  up to 8 rigid parts: code 10 + i turns about
                   its own centre c and axis a at speed s
     opts.motion   GLSL: vec3 motion(vec3 p, float c, float t, inout float b, inout float a)
                   per-particle hook in local units: p = rest position (after its group turn), c = code,
                   t = scene seconds (frozen under reduced motion), b = brightness multiplier, a = accent 0..1.
                   Codes 2-4, 6-9 and 18+ are free for the hook to interpret (ids, params, ...).
     opts.uniforms extra uniforms for the hook (declare them inside the motion string)
     opts.t0       scene time to start from (and to freeze at under reduced motion)
     opts.mobile() true for the stacked phone layout (default: panel narrower than 700px)
   The sim still springs every particle to its rest position (assembly with sparkles, then calm); the hook's
   offset is added at draw time, so continuous motion never lags or sparkles.
   Returns a handle { dispose(), step(n) } (or null when WebGL is unavailable).
   ===================================================================================================== */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const IFR = window.self !== window.top;
const SMALL = IFR || Math.min(innerWidth, innerHeight) < 600;
const CAMZ = 12, FOV = 30;
const hooks = [];
window.__stars = (n = 60) => hooks.forEach((f) => f(n));   // test hook: fast-forward every mounted scene
const GL = { live: 0, max: 0, changed() { const el = document.getElementById('live'); if (el) el.textContent = this.live; } };
const HAS_GL = (() => { try { const c = document.createElement('canvas'), g = c.getContext('webgl2'); if (!g) return false;
  const ok = !!g.getExtension('EXT_color_buffer_float') && g.getParameter(g.MAX_VERTEX_TEXTURE_IMAGE_UNITS) > 0;
  const lc = g.getExtension('WEBGL_lose_context'); lc && lc.loseContext(); return ok; } catch (e) { return false; } })();

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = (r) => { let u = 0, v = 0; while (u === 0) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v); };
const enc = (code, br, acc) => code + Math.min(.98, Math.max(0, br)) * .49 + (acc ? .5 : 0);

const VEL = /* glsl */`
uniform float uDt, uTime, uSpring, uDamp, uNoise, uFlow, uSpin; uniform mat3 uTilt; uniform sampler2D tT;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 pot(vec3 p){ float t = uTime * .13;
  return vec3(sin(p.y * 1.1 + t) + .6 * sin(p.z * 1.9 - t * 1.3 + p.x * .7), sin(p.z * 1.3 - t * .9) + .6 * sin(p.x * 2.1 + t * .7 + p.y * .6), sin(p.x * 1.2 + t * 1.1) + .6 * sin(p.y * 1.7 - t + p.z * .5)); }
vec3 curl(vec3 p){ const float e = .09; vec3 dx = vec3(e, 0., 0.), dy = vec3(0., e, 0.), dz = vec3(0., 0., e);
  vec3 x0 = pot(p - dx), x1 = pot(p + dx), y0 = pot(p - dy), y1 = pot(p + dy), z0 = pot(p - dz), z1 = pot(p + dz);
  return vec3((y1.z - y0.z) - (z1.y - z0.y), (z1.x - z0.x) - (x1.z - x0.z), (x1.y - x0.y) - (y1.x - y0.x)) / (2. * e); }
void main(){
  vec2 uv = gl_FragCoord.xy / resolution.xy;
  vec4 P = texture2D(texturePosition, uv), V = texture2D(textureVelocity, uv), t = texture2D(tT, uv);
  vec3 tgt = t.xyz; float code = floor(t.w), k = uSpring;

  else if (code > 4.5 && code < 5.5) tgt += vec3(sin(uTime * .05 + t.y), cos(uTime * .04 + t.x), 0.) * .25;   // dust drifts slowly
  vec3 d = tgt - P.xyz; float h = hash12(uv * 733.1);
  vec3 acc = d * k * (.7 + .6 * h); float am = length(acc); if (am > 34.) acc *= 34. / am;
  acc += curl(P.xyz * .5) * (uNoise + smoothstep(.06, 1.4, length(d)) * uFlow);   // swirl only while travelling
  V.xyz += acc * uDt; V.xyz *= exp(-uDamp * uDt);
  gl_FragColor = V;
}`;
const POS = /* glsl */`uniform float uDt;
void main(){ vec2 uv = gl_FragCoord.xy / resolution.xy; vec4 P = texture2D(texturePosition, uv); vec4 V = texture2D(textureVelocity, uv); P.xyz += V.xyz * uDt; gl_FragColor = P; }`;

const DEFAULT_MOTION = 'vec3 motion(vec3 p, float c, float t, inout float b, inout float a){ return p; }';
const vertexShader = (motion) => /* glsl */`
uniform sampler2D tPos, tVel, tT; uniform float uSize, uAlpha, uT, uSc; uniform vec3 uAcc; uniform mat3 uView;
uniform vec3 uGC[8]; uniform vec4 uGA[8];
attribute vec2 ref; attribute float rnd; varying vec3 vCol; varying float vA;
#define PI 3.14159265
#define TAU 6.28318531
float hash11(float n){ return fract(sin(n * 127.1 + 31.7) * 43758.5453); }
vec3 rotA(vec3 p, vec3 a, float g){ float c = cos(g), s = sin(g); return p * c + cross(a, p) * s + a * dot(a, p) * (1. - c); }
vec3 rotX(vec3 p, float g){ float c = cos(g), s = sin(g); return vec3(p.x, c * p.y - s * p.z, s * p.y + c * p.z); }
vec3 rotY(vec3 p, float g){ float c = cos(g), s = sin(g); return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z); }
vec3 rotZ(vec3 p, float g){ float c = cos(g), s = sin(g); return vec3(c * p.x - s * p.y, s * p.x + c * p.y, p.z); }
float bump(float x, float w){ return exp(-x * x / (w * w)); }
vec3 grp(vec3 p, float c, float t){ if (c > 9.5 && c < 17.5) { int k = int(c - 9.5); vec3 o = uGC[k]; vec4 a = uGA[k]; return o + rotA(p - o, a.xyz, t * a.w); } return p; }

  float code = floor(t.w), f = fract(t.w), ac = step(.5, f), br = clamp((f - ac * .5) / .49, 0., 1.), bm = 1.;
  bool dust = code > 4.5 && code < 5.5;

  vec4 mv = modelViewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv;
  bm = clamp(bm, 0., 3.); ac = clamp(ac, 0., 1.);
  float fast = smoothstep(1.2, 3.6, length(v)) * smoothstep(.55, .75, rnd), hot = clamp(fast + ac * .85, 0., 1.);

  vCol = mix(mix(vec3(.62, .62, .62), vec3(1.), br) * (.3 + .7 * br), vec3(1.25), fast);   // monochrome; fast-moving sparkles go white
  vCol = mix(vCol, uAcc * 1.6, ac * .85);                                                       // accent stars take the scene's accent colour
  vA = uAlpha * (.1 + .36 * br * br) * (dust ? .9 : 1.) * smoothstep(1.2, 4.5, -mv.z) * (1. + hot * .6) * bm;

const fragmentShader = /* glsl */`varying vec3 vCol; varying float vA;
void main(){ vec2 c = gl_PointCoord - .5; float a = exp(-dot(c, c) * 12.8) - .04; if (a <= 0.) discard; gl_FragColor = vec4(vCol, a * vA); }`;

function viewMatrix(list) {

}

// opts: size (sim texture side), shape(n) -> Float32Array | {pts, w, h}, place(W, H, mob, sh) -> { ppu (px per local unit), cx, cy },
//       bright (alpha multiplier), dust (share of particles), accent, screen, tilt/spin (code 1), view, groups, motion, uniforms, t0,
//       onFail(), onLost()
async function mountStars(panel, opts) {
  if (!panel) return null;
  const fail0 = () => { panel.classList.remove('has-stars', 'stars-in'); opts.onFail && opts.onFail(); };
  if (!HAS_GL) { fail0(); return null; }
  const SIZE = opts.size || 160, N = SIZE * SIZE, NDUST = Math.floor(N * (opts.dust ?? .08)), NS = N - NDUST;
  const sh = await opts.shape(NS), local = sh.pts || sh;
  const canvas = document.createElement('canvas'); canvas.className = 'stars'; canvas.setAttribute('aria-hidden', 'true'); panel.prepend(canvas);
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' }); }
  catch (e) { canvas.remove(); fail0(); return null; }
  GL.live++; GL.max = Math.max(GL.max, GL.live); GL.changed();
  let dead = false, raf = 0, timer = 0, io = null, ro = null, gpu = null, geo = null, mat = null, composer = null, bloom = null, outPass = null, tTex = null, hook = null;
  function kill(lost) {
    if (dead) return; dead = true;
    cancelAnimationFrame(raf); clearTimeout(timer); io && io.disconnect(); ro && ro.disconnect();
